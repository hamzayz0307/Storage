<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Box Finder</title>
<meta name="description" content="Photograph what goes in each box, print a QR label, and find anything later.">
<meta name="theme-color" content="#E6E9EC" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#14171B" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/icons/icon.svg" type="image/svg+xml">
<link rel="icon" href="/icons/favicon-32.png" sizes="32x32" type="image/png">
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="stylesheet" href="/fonts/fonts.css">
<script>
  (function () {
    try {
      var t = localStorage.getItem('bf_theme') || 'system';
      var dark = t === 'dark' || (t === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches);
      document.documentElement.setAttribute('data-theme', dark ? 'dark' : 'light');
    } catch (e) {}
  })();
</script>
<style>
:root {
  --bg: #E6E9EC;
  --bg-soft: #EEF0F2;
  --surface: #FFFFFF;
  --line: #D5DADF;
  --line-strong: #B7BFC7;
  --ink: #1D2430;
  --ink-2: #4A5563;
  --ink-3: #737E8C;
  --on-ink: #FFFFFF;
  --kraft: #C99D66;
  --kraft-ink: #2A1E10;
  --tape: rgba(255, 255, 255, 0.5);
  --accent: #2B4CC4;
  --accent-soft: #E3E8FA;
  --ok: #2F7A4E;
  --bad: #B8402B;
  --bad-soft: #F8E4DF;
  --shadow-lift: 0 6px 20px rgba(20, 25, 35, 0.22);
  --seg-on: #FFFFFF;
  --kraft-grain:
    repeating-linear-gradient(100deg, rgba(70, 40, 10, 0.05) 0 1px, transparent 1px 6px),
    repeating-linear-gradient(12deg, rgba(255, 255, 255, 0.07) 0 2px, transparent 2px 9px);
  --font-ui: 'Instrument Sans', system-ui, -apple-system, 'Segoe UI', sans-serif;
  --font-display: 'Big Shoulders', 'Arial Narrow', 'Roboto Condensed', sans-serif;
  --font-code: 'Big Shoulders Stencil', 'Big Shoulders', 'Arial Narrow', sans-serif;
  color-scheme: light;
}
:root[data-theme="dark"] {
  --bg: #14171B;
  --bg-soft: #1B1F24;
  --surface: #1F242A;
  --line: #2E353D;
  --line-strong: #444D57;
  --ink: #E7EAEE;
  --ink-2: #B3BBC5;
  --ink-3: #8792A0;
  --on-ink: #14171B;
  --kraft: #BE9260;
  --kraft-ink: #22170A;
  --tape: rgba(255, 255, 255, 0.22);
  --accent: #8EA2F2;
  --accent-soft: #252C45;
  --ok: #6CC08F;
  --bad: #E58066;
  --bad-soft: #3A2420;
  --shadow-lift: 0 6px 20px rgba(0, 0, 0, 0.5);
  --seg-on: #3A424C;
  color-scheme: dark;
}

* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0;
  min-height: 100dvh;
  background: var(--bg);
  color: var(--ink);
  font: 400 16px/1.5 var(--font-ui);
  -webkit-tap-highlight-color: transparent;
}
body.signed-in { padding-bottom: calc(92px + env(safe-area-inset-bottom)); }
body.sheet-open { overflow: hidden; }
body[data-page="boxes"] #view { padding-bottom: 96px; }
button, input, select, textarea { font: inherit; color: inherit; }
a { color: inherit; }
[hidden] { display: none !important; }
:focus-visible { outline: 2.5px solid var(--accent); outline-offset: 2px; }
.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

.i { width: 22px; height: 22px; flex: none; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }

#view { max-width: 680px; margin: 0 auto; padding: calc(14px + env(safe-area-inset-top)) 16px 28px; }

/* ---------- type ---------- */
.page-head { margin: 10px 0 16px; }
.page-title { margin: 0; font: 800 38px/1 var(--font-display); letter-spacing: 0.005em; overflow-wrap: anywhere; }
.page-sub { margin: 6px 0 0; color: var(--ink-3); font-size: 14px; }
.page-intro { margin: -4px 0 20px; color: var(--ink-2); max-width: 52ch; }
.section-title { margin: 0 0 10px; font: 700 23px/1.15 var(--font-display); }
.muted { color: var(--ink-3); }

/* ---------- kraft label: the box identity ---------- */
.kraft { background-color: var(--kraft); background-image: var(--kraft-grain); color: var(--kraft-ink); }
.code { font: 800 27px/1 var(--font-code); letter-spacing: 0.02em; }
.code-chip { flex: none; padding: 6px 9px 4px; border-radius: 6px; font: 800 20px/1 var(--font-code); letter-spacing: 0.02em; }

.label-hero { position: relative; margin: 10px 0 22px; padding: 30px 20px 22px; border-radius: 10px; }
.label-hero::before {
  content: '';
  position: absolute;
  top: -9px;
  left: 50%;
  width: 96px;
  height: 24px;
  margin-left: -48px;
  background: var(--tape);
  transform: rotate(-2.5deg);
  box-shadow: 0 1px 2px rgba(0, 0, 0, 0.08);
}
.code-xl { font: 800 clamp(66px, 21vw, 104px)/0.86 var(--font-code); letter-spacing: 0.01em; }
.hero-name { margin: 12px 0 4px; font: 700 29px/1.08 var(--font-display); overflow-wrap: anywhere; }
.hero-place { display: flex; align-items: center; gap: 6px; margin: 0; font-weight: 500; opacity: 0.85; }
.hero-place .i { width: 18px; height: 18px; }
.hero-edit {
  position: absolute;
  top: 12px;
  right: 12px;
  display: grid;
  place-items: center;
  width: 42px;
  height: 42px;
  border: 0;
  border-radius: 50%;
  background: rgba(255, 255, 255, 0.42);
  color: inherit;
  cursor: pointer;
}
.hero-edit .i { width: 19px; height: 19px; }

/* ---------- controls ---------- */
.btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  min-height: 46px;
  padding: 0 18px;
  border: 1px solid var(--line-strong);
  border-radius: 12px;
  background: var(--surface);
  font-weight: 600;
  text-decoration: none;
  cursor: pointer;
  white-space: nowrap;
}
.btn.primary { background: var(--ink); border-color: var(--ink); color: var(--on-ink); }
.btn.danger { background: var(--bad); border-color: var(--bad); color: #fff; }
.btn.ghost { background: transparent; border-color: transparent; }
.btn.big { width: 100%; min-height: 56px; font-size: 17px; }
.btn.block { width: 100%; }
.btn:disabled { opacity: 0.45; cursor: not-allowed; }
.icon-btn {
  display: grid;
  place-items: center;
  width: 44px;
  height: 44px;
  border: 0;
  border-radius: 12px;
  background: transparent;
  color: var(--ink);
  text-decoration: none;
  cursor: pointer;
}
.icon-btn:hover { background: var(--bg-soft); }
.link-btn { padding: 6px 2px; border: 0; background: none; color: var(--accent); font-weight: 600; cursor: pointer; }
.danger-link { padding: 12px 0; border: 0; background: none; color: var(--bad); font-weight: 600; cursor: pointer; }

.input {
  width: 100%;
  min-height: 48px;
  padding: 10px 14px;
  border: 1px solid var(--line-strong);
  border-radius: 12px;
  background: var(--surface);
  outline: 0;
}
.input:focus { border-color: var(--ink); }
textarea.input { resize: vertical; min-height: 72px; }
select.input { appearance: none; padding-right: 36px; background-image: linear-gradient(45deg, transparent 50%, var(--ink-3) 50%), linear-gradient(135deg, var(--ink-3) 50%, transparent 50%); background-position: calc(100% - 19px) 52%, calc(100% - 14px) 52%; background-size: 5px 5px; background-repeat: no-repeat; }
.field { display: flex; flex-direction: column; gap: 6px; margin-bottom: 14px; }
.field > span { color: var(--ink-2); font-size: 14px; font-weight: 600; }
.field .opt { color: var(--ink-3); font-weight: 400; }
.hint { margin: 6px 2px 0; color: var(--ink-3); font-size: 13px; }
input[type="checkbox"] { width: 20px; height: 20px; accent-color: var(--ink); }
.error { margin: 10px 0 0; padding: 10px 12px; border-radius: 10px; background: var(--bad-soft); color: var(--bad); font-size: 14px; }
.note { margin: 10px 0 0; padding: 10px 12px; border-radius: 10px; background: var(--accent-soft); color: var(--ink); font-size: 14px; }

.seg { display: flex; gap: 4px; padding: 4px; border: 1px solid var(--line); border-radius: 12px; background: var(--bg-soft); }
.seg button { flex: 1; padding: 9px 8px; border: 0; border-radius: 9px; background: none; color: var(--ink-2); font-size: 14px; font-weight: 600; cursor: pointer; }
.seg button[aria-pressed="true"] { background: var(--seg-on); color: var(--ink); box-shadow: 0 1px 2px rgba(0, 0, 0, 0.14); }

.stepper { display: flex; align-items: center; width: max-content; border: 1px solid var(--line-strong); border-radius: 12px; background: var(--surface); }
.stepper button { width: 46px; height: 46px; border: 0; background: none; cursor: pointer; display: grid; place-items: center; }
.stepper input { width: 60px; height: 46px; border: 0; background: transparent; outline: 0; text-align: center; font-weight: 600; -moz-appearance: textfield; }
.stepper input::-webkit-inner-spin-button { -webkit-appearance: none; }

.spinner { width: 34px; height: 34px; border: 3px solid var(--line); border-top-color: var(--ink); border-radius: 50%; animation: spin 0.8s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
.center-screen { display: grid; place-items: center; gap: 14px; min-height: 60dvh; text-align: center; color: var(--ink-2); }
.center-screen > div { display: grid; justify-items: center; gap: 14px; max-width: 34ch; }

/* ---------- home ---------- */
.search {
  display: flex;
  align-items: center;
  gap: 10px;
  height: 58px;
  padding: 0 6px 0 16px;
  border: 1.5px solid var(--line-strong);
  border-radius: 14px;
  background: var(--surface);
}
.search:focus-within { border-color: var(--ink); }
.search > .i { color: var(--ink-3); }
.search input { flex: 1; min-width: 0; height: 100%; border: 0; outline: 0; background: transparent; font-size: 17px; }
.search input::-webkit-search-cancel-button { display: none; }

.chips { display: flex; gap: 8px; margin: 16px -16px 2px; padding: 0 16px 4px; overflow-x: auto; scrollbar-width: none; }
.chips::-webkit-scrollbar { display: none; }
.chip { flex: none; padding: 7px 14px; border: 1px solid var(--line-strong); border-radius: 999px; background: var(--surface); font-size: 14px; font-weight: 500; white-space: nowrap; cursor: pointer; }
.chip .n { margin-left: 4px; color: var(--ink-3); font-weight: 400; }
.chip[aria-pressed="true"] { background: var(--ink); border-color: var(--ink); color: var(--on-ink); }
.chip[aria-pressed="true"] .n { color: inherit; opacity: 0.7; }

.grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; margin-top: 14px; }
@media (min-width: 560px) { .grid { grid-template-columns: repeat(3, minmax(0, 1fr)); } }
.tile { display: flex; flex-direction: column; overflow: hidden; border: 1px solid var(--line); border-radius: 14px; background: var(--surface); text-decoration: none; }
.tile:active { transform: scale(0.985); }
.tile-label { padding: 7px 12px 5px; }
.tile-photo { position: relative; aspect-ratio: 4 / 3; overflow: hidden; background: var(--bg-soft); }
.tile-photo img { display: block; width: 100%; height: 100%; object-fit: cover; }
img[data-path] { opacity: 0; transition: opacity 0.2s; }
img[data-path].loaded { opacity: 1; }
.ph { position: absolute; inset: 0; display: grid; place-items: center; color: var(--line-strong); }
.ph .i { width: 40px; height: 40px; stroke-width: 1.4; }
.tile-body { display: flex; flex-direction: column; gap: 2px; min-width: 0; padding: 10px 12px 12px; }
.tile-name { display: -webkit-box; overflow: hidden; font-size: 15px; font-weight: 600; line-height: 1.3; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow-wrap: anywhere; }
.tile-meta { color: var(--ink-2); font-size: 13px; }
.tile-place { display: flex; align-items: center; gap: 4px; overflow: hidden; color: var(--ink-3); font-size: 13px; white-space: nowrap; }
.tile-place span { overflow: hidden; text-overflow: ellipsis; }
.tile-place .i { width: 14px; height: 14px; }

.results-head { margin: 16px 2px 0; color: var(--ink-3); font-size: 14px; }
.list { margin: 0; padding: 0; overflow: hidden; border: 1px solid var(--line); border-radius: 14px; background: var(--surface); list-style: none; }
.list > li + li { border-top: 1px solid var(--line); }
.results { margin-top: 8px; }
.result { display: flex; align-items: center; gap: 12px; padding: 12px 14px; text-decoration: none; }
.result-main { flex: 1; min-width: 0; }
.result-name { display: block; font-weight: 600; overflow-wrap: anywhere; }
.result-where { display: block; overflow: hidden; color: var(--ink-3); font-size: 13px; white-space: nowrap; text-overflow: ellipsis; }
.result-kind { display: inline-flex; align-items: center; gap: 4px; color: var(--ink-3); font-size: 13px; font-weight: 500; }
.result-kind .i { width: 15px; height: 15px; }
.qty { color: var(--ink-2); font-size: 14px; font-weight: 600; font-variant-numeric: tabular-nums; }

.fab {
  position: fixed;
  right: max(16px, calc(50vw - 324px));
  bottom: calc(88px + env(safe-area-inset-bottom));
  z-index: 20;
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 14px 20px 14px 16px;
  border: 0;
  border-radius: 999px;
  background: var(--ink);
  color: var(--on-ink);
  font-weight: 600;
  box-shadow: var(--shadow-lift);
  cursor: pointer;
}

.empty { margin-top: 16px; padding: 26px 20px; border: 1.5px dashed var(--line-strong); border-radius: 16px; }
.empty h2 { margin: 0 0 6px; font: 700 25px/1.12 var(--font-display); }
.empty p { margin: 0 0 16px; max-width: 46ch; color: var(--ink-2); }
.empty p:last-child { margin-bottom: 0; }

/* ---------- box page ---------- */
.bar { display: flex; align-items: center; justify-content: space-between; margin: -4px -8px 4px; }
.box-notes { margin: -8px 0 20px; color: var(--ink-2); white-space: pre-line; overflow-wrap: anywhere; }
.strip { display: flex; gap: 8px; margin: 0 -16px 18px; padding: 0 16px 4px; overflow-x: auto; scrollbar-width: none; }
.strip::-webkit-scrollbar { display: none; }
.thumb { position: relative; flex: none; width: 88px; height: 88px; padding: 0; overflow: hidden; border: 1px solid var(--line); border-radius: 10px; background: var(--bg-soft); cursor: pointer; }
.thumb img { display: block; width: 100%; height: 100%; object-fit: cover; }
.thumb.add { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; border-style: dashed; border-color: var(--line-strong); color: var(--ink-2); font-size: 12px; font-weight: 600; }
.thumb .badge { position: absolute; left: 4px; bottom: 4px; padding: 1px 6px; border-radius: 6px; background: var(--ink); color: var(--on-ink); font-size: 11px; font-weight: 600; }
.items { margin-top: 26px; }
.group { margin-top: 14px; }
.group-name { margin: 0 0 6px 2px; color: var(--ink-3); font-size: 13px; font-weight: 600; }
.item-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; width: 100%; padding: 13px 14px; border: 0; background: none; font-size: 16px; text-align: left; cursor: pointer; }
.item-row .name { overflow-wrap: anywhere; }
.quick-add { display: flex; gap: 8px; margin-top: 16px; }
.quick-add .input { flex: 1; min-width: 0; }

/* ---------- places, labels, me ---------- */
.place-row { display: flex; align-items: center; gap: 12px; width: 100%; padding: 14px; border: 0; background: none; font-size: 16px; text-align: left; cursor: pointer; }
.place-row .i { color: var(--ink-3); }
.place-name { flex: 1; min-width: 0; font-weight: 600; overflow-wrap: anywhere; }
.place-count { color: var(--ink-3); font-size: 14px; white-space: nowrap; }
.stack { display: flex; flex-direction: column; gap: 22px; }
.setting-title { margin: 0 0 8px; color: var(--ink-2); font-size: 14px; font-weight: 600; }
.pick-list label { display: flex; align-items: center; gap: 12px; padding: 11px 14px; cursor: pointer; }
.pick-list .pl-main { flex: 1; min-width: 0; }
.pick-list .pl-name { display: block; overflow: hidden; font-weight: 600; white-space: nowrap; text-overflow: ellipsis; }
.pick-list .pl-sub { display: block; color: var(--ink-3); font-size: 13px; }
.pick-list .code-chip { font-size: 17px; }
.quick-sel { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 10px; }
.preview-frame { position: relative; overflow: hidden; border: 1px solid var(--line); border-radius: 8px; background: #fff; }
.preview-frame .print-page { position: absolute; top: 0; left: 0; transform-origin: top left; padding: 0; }
.preview-note { margin: 8px 2px 0; color: var(--ink-3); font-size: 13px; }
.sticky-cta { position: sticky; bottom: calc(80px + env(safe-area-inset-bottom)); margin-top: 18px; z-index: 5; }

/* ---------- printable labels ---------- */
.print-page { display: grid; width: 190mm; height: 277mm; gap: 3mm; background: #fff; color: #000; }
.print-page.large { grid-template-columns: repeat(2, 1fr); grid-template-rows: repeat(4, 1fr); }
.print-page.small { grid-template-columns: repeat(3, 1fr); grid-template-rows: repeat(8, 1fr); }
.plabel { display: flex; align-items: center; gap: 4mm; min-width: 0; padding: 4mm; overflow: hidden; border: 0.3mm dashed #9aa0a6; background: #fff; color: #000; }
.plabel svg { flex: none; width: 40mm; height: 40mm; }
.plabel .pl-text { min-width: 0; }
.plabel .pl-code { font: 800 34pt/0.88 var(--font-code); letter-spacing: 0.01em; }
.plabel .pl-name { display: -webkit-box; margin-top: 2.5mm; overflow: hidden; font: 600 11.5pt/1.2 var(--font-ui); -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow-wrap: anywhere; }
.plabel .pl-place { margin-top: 1.2mm; overflow: hidden; color: #333; font: 400 8.5pt/1.25 var(--font-ui); white-space: nowrap; text-overflow: ellipsis; }
.small .plabel { gap: 2.5mm; padding: 2.5mm; }
.small .plabel svg { width: 24mm; height: 24mm; }
.small .plabel .pl-code { font-size: 19pt; }
.small .plabel .pl-name { margin-top: 1.2mm; font-size: 7.5pt; }
.small .plabel .pl-place { display: none; }
#printArea { display: none; }
@page { size: A4; margin: 10mm; }
@media print {
  body { background: #fff !important; padding: 0 !important; }
  body > *:not(#printArea) { display: none !important; }
  #printArea { display: block; }
  .print-page { break-after: page; }
  .print-page:last-child { break-after: auto; }
}

/* ---------- bottom navigation ---------- */
#tabbar { position: fixed; left: 0; right: 0; bottom: 0; z-index: 30; display: none; padding: 4px 8px calc(4px + env(safe-area-inset-bottom)); border-top: 1px solid var(--line); background: var(--surface); }
body.signed-in #tabbar { display: block; }
.tabs { display: grid; grid-template-columns: repeat(5, 1fr); align-items: end; max-width: 680px; margin: 0 auto; }
.tab { display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 7px 0 5px; border: 0; background: none; color: var(--ink-3); font-size: 12px; font-weight: 600; text-decoration: none; cursor: pointer; }
.tab[aria-current="page"] { color: var(--ink); }
.tab-scan { color: var(--ink); }
.scan-disc { display: grid; place-items: center; width: 58px; height: 58px; margin-top: -26px; border: 4px solid var(--surface); border-radius: 50%; background: var(--ink); color: var(--on-ink); box-shadow: var(--shadow-lift); }
.scan-disc .i { width: 26px; height: 26px; }

/* ---------- sheets ---------- */
#sheetRoot { position: fixed; inset: 0; z-index: 50; display: flex; align-items: flex-end; justify-content: center; }
.sheet-backdrop { position: absolute; inset: 0; background: rgba(12, 15, 20, 0.5); opacity: 0; transition: opacity 0.2s; }
.sheet {
  position: relative;
  width: 100%;
  max-width: 560px;
  max-height: 92dvh;
  overflow: auto;
  padding: 22px 18px calc(18px + env(safe-area-inset-bottom));
  border-radius: 20px 20px 0 0;
  background: var(--surface);
  opacity: 0;
  transform: translateY(24px);
  transition: transform 0.22s ease, opacity 0.22s;
}
#sheetRoot.open .sheet-backdrop { opacity: 1; }
#sheetRoot.open .sheet { opacity: 1; transform: none; }
@media (min-width: 600px) { #sheetRoot { align-items: center; padding: 20px; } .sheet { border-radius: 20px; } }
.sheet h2 { margin: 0 0 6px; font: 700 27px/1.08 var(--font-display); overflow-wrap: anywhere; }
.sheet .lead { margin: 0 0 16px; color: var(--ink-2); }
.sheet-actions { position: sticky; bottom: calc(-18px - env(safe-area-inset-bottom)); display: flex; flex-wrap: wrap; gap: 10px; margin: 18px -18px calc(-18px - env(safe-area-inset-bottom)); padding: 12px 18px calc(18px + env(safe-area-inset-bottom)); background: var(--surface); }
.sheet-actions .btn { flex: 1; }
.sheet-actions .btn.ghost { flex: 0 1 auto; }
.sheet-actions .btn.btn-icon { flex: 0 0 46px; padding: 0; }
.menu { margin: 6px 0 0; padding: 0; list-style: none; }
.menu button { display: flex; align-items: center; gap: 12px; width: 100%; padding: 15px 2px; border: 0; border-bottom: 1px solid var(--line); background: none; font-size: 16px; font-weight: 500; text-align: left; cursor: pointer; }
.menu li:last-child button { border-bottom: 0; }
.menu .danger { color: var(--bad); }

.shots { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin: 4px 0 12px; }
.shot { position: relative; aspect-ratio: 1; overflow: hidden; border-radius: 10px; background: var(--bg-soft); }
.shot img { display: block; width: 100%; height: 100%; object-fit: cover; }
.shot.empty { border: 1.5px dashed var(--line-strong); background: transparent; }
.shot .x { position: absolute; top: 4px; right: 4px; display: grid; place-items: center; width: 28px; height: 28px; padding: 0; border: 0; border-radius: 50%; background: rgba(0, 0, 0, 0.62); color: #fff; cursor: pointer; }
.shot .x .i { width: 16px; height: 16px; }
.pick-row { display: flex; gap: 8px; }
.pick-row .btn { flex: 1; padding: 0 10px; }
.scans-left { margin: 12px 0 0; color: var(--ink-3); font-size: 13px; }
.reading { display: flex; flex-direction: column; align-items: center; gap: 14px; padding: 44px 0 30px; color: var(--ink-2); text-align: center; }
.review { display: flex; flex-direction: column; gap: 8px; margin: 12px 0 0; padding: 0; list-style: none; }
.review li { display: grid; grid-template-columns: auto 1fr 70px; grid-template-areas: "chk name qty" "chk cat cat"; gap: 6px 8px; align-items: center; padding: 10px; border: 1px solid var(--line); border-radius: 12px; }
.review li.off { opacity: 0.5; }
.review .chk { grid-area: chk; }
.review .r-name { grid-area: name; min-height: 42px; }
.review .r-qty { grid-area: qty; min-height: 42px; padding: 8px; text-align: center; }
.review .r-cat { grid-area: cat; min-height: 40px; padding-top: 7px; padding-bottom: 7px; font-size: 14px; }
.check-line { display: flex; align-items: center; gap: 10px; margin-top: 14px; font-weight: 500; }
.viewer img { display: block; width: 100%; max-height: 62dvh; border-radius: 12px; background: var(--bg-soft); object-fit: contain; }

/* ---------- toast & blocker ---------- */
#toast {
  position: fixed;
  left: 50%;
  bottom: calc(100px + env(safe-area-inset-bottom));
  z-index: 80;
  display: flex;
  align-items: center;
  gap: 14px;
  max-width: calc(100vw - 32px);
  padding: 12px 16px;
  border-radius: 12px;
  background: var(--ink);
  color: var(--on-ink);
  font-weight: 500;
  opacity: 0;
  pointer-events: none;
  transform: translate(-50%, 10px);
  transition: opacity 0.2s, transform 0.2s;
}
body:not(.signed-in) #toast { bottom: calc(24px + env(safe-area-inset-bottom)); }
body[data-page="boxes"] #toast { bottom: calc(160px + env(safe-area-inset-bottom)); }
#toast.show { opacity: 1; pointer-events: auto; transform: translate(-50%, 0); }
#toast button { padding: 0; border: 0; background: none; color: inherit; font-weight: 700; text-decoration: underline; cursor: pointer; }
#blocker { position: fixed; inset: 0; z-index: 90; display: grid; place-items: center; background: rgba(12, 15, 20, 0.55); color: #fff; }
#blocker > div { display: grid; justify-items: center; gap: 14px; font-weight: 600; }
#blocker .spinner { border-color: rgba(255, 255, 255, 0.3); border-top-color: #fff; }

/* ---------- scanner ---------- */
#scanner { position: fixed; inset: 0; z-index: 70; display: none; background: #000; color: #fff; }
#scanner.open { display: block; }
#scanVideo { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
.scan-frame { position: absolute; top: 42%; left: 50%; width: min(68vw, 300px); aspect-ratio: 1; border: 3px solid rgba(255, 255, 255, 0.92); border-radius: 18px; box-shadow: 0 0 0 9999px rgba(0, 0, 0, 0.5); transform: translate(-50%, -50%); }
.scan-top { position: absolute; top: 0; left: 0; right: 0; display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: calc(12px + env(safe-area-inset-top)) 12px 12px 18px; }
.scan-title { margin: 0; font: 700 24px/1.1 var(--font-display); }
.scan-top .icon-btn { background: rgba(0, 0, 0, 0.4); color: #fff; }
.scan-bottom { position: absolute; left: 0; right: 0; bottom: 0; padding: 16px 16px calc(20px + env(safe-area-inset-bottom)); background: linear-gradient(transparent, rgba(0, 0, 0, 0.75) 30%); }
.scan-hint { margin: 0 0 12px; font-weight: 600; text-align: center; }
.scan-error { margin: 0 0 12px; padding: 10px 12px; border-radius: 10px; background: rgba(184, 64, 43, 0.92); font-size: 14px; text-align: center; }
.scan-code { display: flex; gap: 8px; max-width: 520px; margin: 0 auto; }
.scan-code .input { flex: 1; min-width: 0; border-color: transparent; background: rgba(255, 255, 255, 0.95); color: #111; }
.scan-code .btn { background: #fff; border-color: #fff; color: #111; }

/* ---------- auth ---------- */
.auth { max-width: 440px; margin: 0 auto; padding-top: 6px; }
.auth-top { display: flex; justify-content: flex-end; margin-bottom: 20px; }
.auth-top .seg { width: 150px; }
.auth-hero { margin-bottom: 26px; }
.auth-hero .code-xl { font-size: clamp(56px, 17vw, 84px); }
.hero-tag { margin: 12px 0 0; font-size: 18px; font-weight: 600; }
.auth-title { margin: 0 0 14px; font: 700 27px/1.1 var(--font-display); }
.auth-form .btn.big { margin-top: 6px; }
.auth-forgot { display: block; margin: 10px auto 0; }
.auth-switch { margin: 22px 0 0; color: var(--ink-2); text-align: center; }

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { transition: none !important; }
  .spinner { animation-duration: 2.4s; }
  .tile:active { transform: none; }
}
</style>

const urlCache = new Map();
async function signedUrls(paths) {
  const now = Date.now();
  const need = Array.from(new Set(paths)).filter((p) => p && !(urlCache.get(p) && urlCache.get(p).exp > now + 60000));
  if (need.length) {
    const res = await sb.storage.from(BUCKET).createSignedUrls(need, 3600);
    if (!res.error && res.data) {
      res.data.forEach((d) => { if (d.signedUrl) urlCache.set(d.path, { url: d.signedUrl, exp: now + 3600 * 1000 }); });
    }
  }
  return (p) => (urlCache.get(p) ? urlCache.get(p).url : null);
}
async function hydrateImages(root) {
  const imgs = $$('img[data-path]', root);
  if (!imgs.length) return;
  try {
    const get = await signedUrls(imgs.map((i) => i.dataset.path));
    imgs.forEach((img) => {
      const u = get(img.dataset.path);
      if (!u) return;
      img.onload = () => img.classList.add('loaded');
      img.src = u;
    });
  } catch (e) { /* photos are optional */ }
}

/* ---------- images ---------- */
function blobToBase64(blob) {
  return new Promise((resolve, reject) => {
    const r = new FileReader();
    r.onload = () => resolve(String(r.result).split(',')[1]);
    r.onerror = reject;
    r.readAsDataURL(blob);
  });
}
async function loadImageSource(file) {
  if ('createImageBitmap' in window) {
    try { return await createImageBitmap(file, { imageOrientation: 'from-image' }); } catch (e) { /* fall back */ }
  }
  return await new Promise((resolve, reject) => {
    const img = new Image();
    img.onload = () => resolve(img);
    img.onerror = reject;
    img.src = URL.createObjectURL(file);
  });
}
// Shrinks a phone photo to max 1280px JPEG (~150–300 KB): cheaper storage and AI.
async function prepareImage(file, maxSide) {
  maxSide = maxSide || 1280;
  const src = await loadImageSource(file);
  const w = src.width, h = src.height;
  if (!w || !h) throw new Error('bad image');
  const scale = Math.min(1, maxSide / Math.max(w, h));
  const cw = Math.round(w * scale), ch = Math.round(h * scale);
  const canvas = document.createElement('canvas');
  canvas.width = cw; canvas.height = ch;
  canvas.getContext('2d').drawImage(src, 0, 0, cw, ch);
  if (src.close) src.close();
  const blob = await new Promise((r) => canvas.toBlob(r, 'image/jpeg', 0.8));
  if (!blob) throw new Error('encode failed');
  return { blob, base64: await blobToBase64(blob), mime: 'image/jpeg', url: URL.createObjectURL(blob) };
}
async function uploadPhotos(box, prepared) {
  const rows = [];
  for (const p of prepared) {
    const path = `${S.space.id}/${box.id}/${uuid()}.jpg`;
    must(await sb.storage.from(BUCKET).upload(path, p.blob, { contentType: 'image/jpeg', upsert: false }));
    rows.push({ box_id: box.id, path });
  }
  const inserted = must(await sb.from('box_photos').insert(rows).select('id,box_id,path,created_at')) || [];
  if (!box.cover_photo_id && inserted.length) {
    must(await sb.from('boxes').update({ cover_photo_id: inserted[0].id }).eq('id', box.id));
    box.cover_photo_id = inserted[0].id;
  }
  return inserted;
}
async function removeFiles(paths) {
  for (let i = 0; i < paths.length; i += 100) {
    await sb.storage.from(BUCKET).remove(paths.slice(i, i + 100));
  }
}

async function callBoxAI(body) {
  let res, json = null;
  try {
    const sess = await sb.auth.getSession();
    const token = sess && sess.data && sess.data.session ? sess.data.session.access_token : '';
    res = await fetch(AI_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', Authorization: 'Bearer ' + token, apikey: CFG.SUPABASE_ANON_KEY || '' },
      body: JSON.stringify(body)
    });
  } catch (e) {
    const err = new Error('network'); err.code = 'network'; throw err;
  }
  try { json = await res.json(); } catch (e) { json = null; }
  if (json && typeof json.remaining === 'number') { S.aiRemaining = json.remaining; S.aiLimit = json.limit; }
  if (!res.ok) {
    const err = new Error((json && json.error) || ('http_' + res.status));
    err.code = (json && json.error) || 'http';
    throw err;
  }
  return json;
}

  try { await callBoxAI({ action: 'usage' }); } catch (e) { /* not critical */ }

async function start() {
  setLang(initialLang(), false);
  if (!sb) { renderSetupNeeded(); return; }
  // Opened from a "set a new password" email: show the password form, not the app.
  if (/type=recovery/.test(location.hash + location.search)) S.recovering = true;
  sb.auth.onAuthStateChange((event, session) => { setTimeout(() => onAuth(event, session), 0); });
}

let booting = false;
async function onAuth(event, session) {
  if (event === 'PASSWORD_RECOVERY') { S.recovering = true; S.session = session; renderNewPassword(); return; }
  if (!session) {
    resetSignedOut();
    renderAuth('in', S.pendingAuthMessage);
    S.pendingAuthMessage = null;
    return;
  }
  S.session = session;
  if (S.recovering) { renderNewPassword(); return; }
  if (S.loaded && S.user && S.user.id === session.user.id) return;
  if (booting) return;
  S.user = session.user;
  await bootstrap();
}
async function bootstrap() {
  booting = true;
  renderLoading();
  try {
    const data = must(await sb.rpc('bootstrap_me', { p_language: S.lang, p_space_name: t('default_space') }));
    S.profile = data.profile;
    S.space = data.space;
    S.role = data.role;
    if (S.profile && S.profile.language && S.profile.language !== S.lang) setLang(S.profile.language, false);
    await loadAll();
    if (S.recovering) return;
    S.loaded = true;
    document.body.classList.add('signed-in');
    const params = new URLSearchParams(location.search);
    const boxParam = params.get('box');
    if (boxParam) history.replaceState(null, '', location.pathname + '#/box/' + encodeURIComponent(boxParam));
    route();
  } catch (e) {
    console.error(e);
    renderFatal(e, bootstrap);
  } finally {
    booting = false;
  }
}
function resetSignedOut() {
  Object.assign(S, { session: null, user: null, profile: null, space: null, locations: [], boxes: [], loaded: false, filter: 'all', query: '', current: null, aiLimit: null, aiRemaining: null, labelSel: null });
  urlCache.clear();
  closeSheet();
  closeScanner();
  document.body.classList.remove('signed-in');
  document.body.dataset.page = 'auth';
}

        <label class="field"><span>${t('password')}</span><input class="input" type="password" name="password" autocomplete="${isIn ? 'current-password' : 'new-password'}" minlength="6" required></label>
        <div class="error" id="authErr" hidden></div>

        <button class="btn primary big" type="submit">${isIn ? t('sign_in') : t('create_account')}</button>
        ${isIn ? `<button type="button" class="link-btn auth-forgot" id="forgotBtn">${t('forgot_password')}</button>` : ''}
      </form>
      <p class="auth-switch">${isIn ? t('no_account') : t('have_account')} <button type="button" class="link-btn" id="authSwitch">${isIn ? t('create_account') : t('sign_in')}</button></p>
    </div>`;

  const form = $('#authForm');
  const err = $('#authErr');
  const note = $('#authNote');
  const showErr = (m) => { err.textContent = m; err.hidden = false; note.hidden = true; };
  $$('[data-auth-lang]').forEach((b) => b.onclick = () => { setLang(b.dataset.authLang, false); renderAuth(mode); });
  $('#authSwitch').onclick = () => renderAuth(isIn ? 'up' : 'in');
  if (isIn) {
    $('#forgotBtn').onclick = async () => {
      const email = form.email.value.trim();
      if (!/^\S+@\S+\.\S+$/.test(email)) { showErr(t('reset_need_email')); return; }
      const res = await sb.auth.resetPasswordForEmail(email, { redirectTo: location.origin + location.pathname });
      if (res.error) { showErr(friendlyError(res.error)); return; }
      err.hidden = true; note.textContent = t('reset_sent'); note.hidden = false;
    };
  }
  form.onsubmit = async (e) => {
    e.preventDefault();
    const email = form.email.value.trim();
    const password = form.password.value;
    if (!/^\S+@\S+\.\S+$/.test(email)) { showErr(t('err_email')); return; }
    if (password.length < 6) { showErr(t('err_password_short')); return; }
    const btn = form.querySelector('[type=submit]');
    btn.disabled = true;
    try {
      if (isIn) {
        const res = await sb.auth.signInWithPassword({ email, password });
        if (res.error) { showErr(/invalid|credentials/i.test(res.error.message) ? t('err_auth') : friendlyError(res.error)); }
      } else {
        const res = await sb.auth.signUp({ email, password, options: { emailRedirectTo: location.origin + location.pathname } });
        if (res.error) { showErr(res.error.message && /password/i.test(res.error.message) ? t('err_password_short') : friendlyError(res.error)); }
        else if (!res.data.session) { renderAuth('in', t('confirm_email')); return; }
      }
    } catch (ex) {
      showErr(friendlyError(ex));
    } finally {
      if (document.body.contains(btn)) btn.disabled = false;
    }
  };
}

const runSearch = debounce(() => runSearchNow(), 220);

async function renderBox(id) {
  const view = $('#view');
  let box = S.boxes.find((b) => b.id === id);
  if (box) view.innerHTML = boxPageHtml(box, null, null);
  else renderLoading();
  let items, photos;
  try {
    if (!box) {
      if (!/^[0-9a-f-]{36}$/i.test(id)) { renderNotFound(); return; }
      box = must(await sb.from('boxes').select('*').eq('id', id).maybeSingle());
      if (!box) { renderNotFound(); return; }
    }
    [items, photos] = await Promise.all([fetchItems(id), fetchPhotos(id)]);
  } catch (e) {
    if (currentRoute().id === id) renderFatal(e, () => renderBox(id));
    return;
  }
  if (currentRoute().name !== 'box' || currentRoute().id !== id) return;
  S.current = { box, items, photos };
  paintBox();
}
function paintBox() {
  const { box, items, photos } = S.current;
  const view = $('#view');
  view.innerHTML = boxPageHtml(box, items, photos);
  hydrateImages(view);
  $('#quickAdd').onsubmit = (e) => { e.preventDefault(); quickAdd(); };
  $('#photoOnlyInput').onchange = (e) => addPhotosOnly(Array.from(e.target.files || []));
}
async function refreshBox() {
  if (!S.current) return;
  const id = S.current.box.id;
  try {
    const [items, photos] = await Promise.all([fetchItems(id), fetchPhotos(id), loadBoxes()]);
    const fresh = S.boxes.find((b) => b.id === id);
    if (fresh) S.current.box = fresh;
    S.current.items = items;
    S.current.photos = photos;
    if (currentRoute().name === 'box' && currentRoute().id === id) paintBox();
  } catch (e) { toast(friendlyError(e)); }
}

function parseQuickAdd(text) {
  return text.split(/[,;\n]+/).map((s) => s.trim()).filter(Boolean).map((part) => {
    let m = part.match(/^(\d{1,3})\s*(?:x|×|adet|tane|pcs)?\s+(.+)$/i);
    if (m) return { name: m[2].trim(), quantity: +m[1] };
    m = part.match(/^(.+?)\s*(?:x|×)\s*(\d{1,3})$/i);
    if (m) return { name: m[1].trim(), quantity: +m[2] };
    return { name: part, quantity: 1 };
  }).filter((x) => x.name).map((x) => ({ name: x.name.slice(0, 80), quantity: clampQty(x.quantity) }));
}
async function quickAdd() {
  const input = $('#quickAddInput');
  const list = parseQuickAdd(input.value);
  if (!list.length) return;
  const box = S.current.box;
  input.disabled = true;
  try {
    must(await sb.from('items').insert(list.map((x) => ({ box_id: box.id, name: x.name, quantity: x.quantity, category: 'other', source: 'manual' }))));
    toast(tp('added_n', list.length));
    await refreshBox();
    const again = $('#quickAddInput');
    if (again) again.focus();
  } catch (e) {
    input.disabled = false;
    toast(friendlyError(e));
  }
}
async function addPhotosOnly(files) {
  if (!files.length) return;
  showBlocker(t('saving'));
  try {
    const prepared = [];
    for (const f of files.slice(0, 8)) prepared.push(await prepareImage(f));
    await uploadPhotos(S.current.box, prepared);
    prepared.forEach((p) => URL.revokeObjectURL(p.url));
    toast(tp('photo_added', prepared.length));
    await refreshBox();
  } catch (e) {
    console.error(e);
    toast(e && e.message === 'bad image' ? t('err_photo') : friendlyError(e));
  } finally {
    hideBlocker();
  }
}

        ? `<div class="shot"><img src="${st.shots[i].url}" alt=""><button type="button" class="x" data-remove="${i}" aria-label="${t('delete_photo')}">${icon('close')}</button></div>`
        : `<div class="shot empty"></div>`).join('')}
    </div>
    <div class="pick-row">
      <button type="button" class="btn" id="scanCamBtn" ${st.shots.length >= MAX_SCAN_PHOTOS || st.preparing ? 'disabled' : ''}>${icon('camera')}<span>${t('take_photo')}</span></button>
      <button type="button" class="btn" id="scanPickBtn" ${st.shots.length >= MAX_SCAN_PHOTOS || st.preparing ? 'disabled' : ''}>${icon('image')}<span>${t('choose_photos')}</span></button>
    </div>
    <input type="file" id="scanCam" accept="image/*" capture="environment" hidden>
    <input type="file" id="scanPick" accept="image/*" multiple hidden>
    <label class="field" style="margin:16px 0 0"><span>${t('hint_label')} <span class="opt">${t('optional')}</span></span>
      <input class="input" id="scanHint" maxlength="300" placeholder="${t('hint_ph')}" value="${esc(st.hint)}"></label>
    <div class="error" ${st.error ? '' : 'hidden'}>${esc(st.error)}</div>
    <p class="scans-left" id="scansLeft">${esc(usageLine())}</p>
    <div class="sheet-actions">
      <button type="button" class="btn ghost" data-act="sheet-close">${t('cancel')}</button>
      <button type="button" class="btn primary" id="scanGo" ${st.shots.length && !st.preparing ? '' : 'disabled'}>${t('find_items')}</button>
    </div>`;

  const reviewHtml = () => {
    const on = st.found.filter((f) => f.on && f.name.trim()).length;
    return `
      <h2>${tp('review_found', st.found.length)}</h2>
      <p class="lead">${st.found.length ? t('review_hint') : t('review_none')}</p>
      <ul class="review">
        ${st.found.map((it, i) => `
          <li class="${it.on ? '' : 'off'}" data-i="${i}">
            <input type="checkbox" class="chk" ${it.on ? 'checked' : ''} aria-label="${esc(it.name)}">
            <input class="input r-name" value="${esc(it.name)}" maxlength="80" aria-label="${t('item_name')}">
            <input class="input r-qty" type="number" inputmode="numeric" min="1" max="999" value="${it.quantity}" aria-label="${t('quantity')}">
            <select class="input r-cat" aria-label="${t('category')}">${catOptions(it.category)}</select>
          </li>`).join('')}
      </ul>
      <label class="check-line"><input type="checkbox" id="savePhotos" ${st.savePhotos ? 'checked' : ''} ${st.photosSaved ? 'disabled' : ''}>${t('save_photos_too')}</label>
      <div class="error" ${st.error ? '' : 'hidden'}>${esc(st.error)}</div>
      <div class="sheet-actions">
        <button type="button" class="btn ghost" id="scanBack">${t('photos_back')}</button>
        <button type="button" class="btn primary" id="scanAdd" ${on || (st.savePhotos && !st.photosSaved) ? '' : 'disabled'}>${on ? tp('add_n', on) : t('save_photos_only')}</button>
      </div>`;
  };

  const busyHtml = (text) => `<div class="reading"><div class="spinner"></div><span>${esc(text)}</span></div>`;

  function draw() {
    const sheet = $('#sheetRoot .sheet');
    if (!sheet) return;
    if (st.phase === 'pick') sheet.innerHTML = pickHtml();
    else if (st.phase === 'review') sheet.innerHTML = reviewHtml();
    else sheet.innerHTML = busyHtml(st.phase === 'reading' ? t('reading') : t('saving'));
    bind(sheet);
  }

  async function addFiles(files) {
    const room = MAX_SCAN_PHOTOS - st.shots.length;
    if (!files.length || room <= 0) return;
    st.hint = ($('#scanHint') || {}).value || st.hint;
    st.preparing = true; st.error = ''; draw();
    for (const f of files.slice(0, room)) {
      try { st.shots.push(await prepareImage(f)); } catch (e) { st.error = t('err_photo'); }
    }
    st.preparing = false; draw();
  }

  function bind(sheet) {
    if (st.phase === 'pick') {
      $('#scanCamBtn', sheet).onclick = () => $('#scanCam', sheet).click();
      $('#scanPickBtn', sheet).onclick = () => $('#scanPick', sheet).click();
      $('#scanCam', sheet).onchange = (e) => addFiles(Array.from(e.target.files || []));
      $('#scanPick', sheet).onchange = (e) => addFiles(Array.from(e.target.files || []));
      $$('[data-remove]', sheet).forEach((b) => b.onclick = () => {
        const i = +b.dataset.remove;
        URL.revokeObjectURL(st.shots[i].url);
        st.shots.splice(i, 1);
        st.hint = $('#scanHint', sheet).value;
        draw();
      });
      $('#scanHint', sheet).oninput = (e) => { st.hint = e.target.value; };
      $('#scanGo', sheet).onclick = identify;
    }
    if (st.phase === 'review') {
      $$('.review li', sheet).forEach((li) => {
        const it = st.found[+li.dataset.i];
        $('.chk', li).onchange = (e) => { it.on = e.target.checked; li.classList.toggle('off', !it.on); updateAddBtn(sheet); };
        $('.r-name', li).oninput = (e) => { it.name = e.target.value; updateAddBtn(sheet); };
        $('.r-qty', li).onchange = (e) => { it.quantity = clampQty(e.target.value); e.target.value = it.quantity; };
        $('.r-cat', li).onchange = (e) => { it.category = e.target.value; };
      });
      $('#savePhotos', sheet).onchange = (e) => { st.savePhotos = e.target.checked; updateAddBtn(sheet); };
      $('#scanBack', sheet).onclick = () => { st.phase = 'pick'; st.error = ''; draw(); };
      $('#scanAdd', sheet).onclick = save;
    }
  }
  function updateAddBtn(sheet) {
    const on = st.found.filter((f) => f.on && f.name.trim()).length;
    const btn = $('#scanAdd', sheet);
    btn.textContent = on ? tp('add_n', on) : t('save_photos_only');
    btn.disabled = !(on || (st.savePhotos && !st.photosSaved));
  }

  async function identify() {
    st.phase = 'reading'; st.error = ''; draw();
    try {
      const res = await callBoxAI({ action: 'identify', language: S.lang, hint: st.hint.trim(), images: st.shots.map((s) => ({ mime: s.mime, data: s.base64 })) });
      st.found = (res.items || []).map((it) => ({ name: it.name, quantity: clampQty(it.quantity), category: CATEGORIES.includes(it.category) ? it.category : 'other', on: true }));
      st.phase = 'review';
    } catch (e) {
      st.phase = 'pick';
      st.error = e.code === 'daily_limit' ? t('err_daily_limit', { limit: S.aiLimit || 20 })
        : e.code === 'network' ? t('err_offline') : t('err_ai');
    }
    draw();
  }

  async function save() {
    const chosen = st.found.filter((f) => f.on && f.name.trim());
    st.phase = 'saving'; st.error = ''; draw();
    try {
      if (st.savePhotos && !st.photosSaved && st.shots.length) {
        await uploadPhotos(box, st.shots);
        st.photosSaved = true;
      }
      if (chosen.length) {
        must(await sb.from('items').insert(chosen.map((f) => ({ box_id: box.id, name: f.name.trim().slice(0, 80), quantity: clampQty(f.quantity), category: f.category, source: 'ai' }))));
      }
      closeSheet();
      toast(chosen.length ? tp('added_n', chosen.length) : tp('photo_added', st.shots.length));
      refreshBox();
    } catch (e) {
      console.error(e);
      st.phase = 'review';
      st.error = friendlyError(e);
      draw();
    }
  }

  openSheet('', { onClose: revokeAll });
  draw();
  refreshUsage().then(() => { const el = $('#scansLeft'); if (el) el.textContent = usageLine(); });
}

/* =====================================================================
   Labels
   ===================================================================== */
function qrSvg(text) {
  const qr = qrcode(0, 'M');
  qr.addData(text);
  qr.make();
  const n = qr.getModuleCount();
  const m = 2;
  let d = '';
  for (let r = 0; r < n; r++) {
    for (let c = 0; c < n; c++) if (qr.isDark(r, c)) d += `M${c + m} ${r + m}h1v1h-1z`;
  }
  return `<svg viewBox="0 0 ${n + 2 * m} ${n + 2 * m}" xmlns="http://www.w3.org/2000/svg" shape-rendering="crispEdges" aria-hidden="true"><rect width="100%" height="100%" fill="#fff"/><path d="${d}" fill="#000"/></svg>`;
}
function labelHtml(b) {
  const loc = locationName(b.location_id);
  return `<div class="plabel">${qrSvg(boxUrl(b.id))}<div class="pl-text"><div class="pl-code">${esc(b.code)}</div><div class="pl-name">${esc(b.name)}</div>${loc ? `<div class="pl-place">${esc(b.spot ? loc + ', ' + b.spot : loc)}</div>` : ''}</div></div>`;
}
function labelPages(boxes, size) {
  const per = size === 'small' ? 24 : 8;
  const pages = [];
  for (let i = 0; i < boxes.length; i += per) pages.push(boxes.slice(i, i + per));
  return pages.map((pg) => `<div class="print-page ${size}">${pg.map(labelHtml).join('')}</div>`).join('');
}
function labelBoxes() {
  const coll = collator();
  return S.boxes.slice().sort((a, b) => coll.compare(a.code, b.code));
}
function renderLabels() {
  try { S.labelSize = localStorage.getItem('bf_label_size') === 'small' ? 'small' : 'large'; } catch (e) {}
  const boxes = labelBoxes();
  const ids = new Set(boxes.map((b) => b.id));
  if (!S.labelSel) S.labelSel = new Set(boxes.filter((b) => !b.label_printed_at).map((b) => b.id));
  S.labelSel = new Set(Array.from(S.labelSel).filter((id) => ids.has(id)));
  if (!boxes.length) {
    $('#view').innerHTML = `
      <header class="page-head"><h1 class="page-title">${t('labels_title')}</h1></header>
      <p class="page-intro">${t('labels_intro')}</p>
      <div class="empty"><p>${t('labels_empty')}</p><p><button type="button" class="btn primary" data-act="new-box">${icon('plus')}${t('new_box')}</button></p></div>`;
    return;
  }
  const dateFmt = new Intl.DateTimeFormat(S.lang === 'tr' ? 'tr-TR' : 'en-GB', { day: 'numeric', month: 'short' });
  const unprinted = boxes.filter((b) => !b.label_printed_at).length;
  $('#view').innerHTML = `
    <header class="page-head"><h1 class="page-title">${t('labels_title')}</h1></header>
    <p class="page-intro">${t('labels_intro')}</p>
    <div class="stack">
      <section>
        <h2 class="setting-title">${t('label_size')}</h2>
        <div class="seg" role="group" aria-label="${t('label_size')}">
          <button type="button" data-act="label-size" data-size="large" aria-pressed="${S.labelSize === 'large'}">${t('size_large')}</button>
          <button type="button" data-act="label-size" data-size="small" aria-pressed="${S.labelSize === 'small'}">${t('size_small')}</button>
        </div>
      </section>
      <section>
        <h2 class="setting-title">${t('which_boxes')}</h2>
        <div class="quick-sel">
          <button type="button" class="chip" data-act="label-sel" data-mode="unprinted">${t('sel_unprinted')}<span class="n">${unprinted}</span></button>
          <button type="button" class="chip" data-act="label-sel" data-mode="all">${t('sel_all')}<span class="n">${boxes.length}</span></button>
          <button type="button" class="chip" data-act="label-sel" data-mode="none">${t('sel_none')}</button>
        </div>
        <ul class="list pick-list">
          ${boxes.map((b) => `<li><label>
            <input type="checkbox" data-label-box="${esc(b.id)}" ${S.labelSel.has(b.id) ? 'checked' : ''}>
            <span class="pl-main"><span class="pl-name">${esc(b.name)}</span><span class="pl-sub">${b.label_printed_at ? esc(t('printed_on', { date: dateFmt.format(new Date(b.label_printed_at)) })) : t('not_printed')}</span></span>
            <span class="code-chip kraft">${esc(b.code)}</span>
          </label></li>`).join('')}
        </ul>
      </section>
      <section id="previewSection">
        <h2 class="setting-title">${t('preview')}</h2>
        <div class="preview-frame" id="previewFrame"></div>
        <p class="preview-note" id="previewNote"></p>
      </section>
    </div>
    <div class="sticky-cta"><button type="button" class="btn primary big" data-act="print-labels" id="printBtn">${icon('printer')}<span></span></button></div>`;
  $$('[data-label-box]').forEach((cb) => cb.onchange = () => {
    if (cb.checked) S.labelSel.add(cb.dataset.labelBox); else S.labelSel.delete(cb.dataset.labelBox);
    updateLabelPreview();
  });
  updateLabelPreview();
}
function updateLabelPreview() {
  const chosen = labelBoxes().filter((b) => S.labelSel.has(b.id));
  const per = S.labelSize === 'small' ? 24 : 8;
  const pages = Math.max(1, Math.ceil(chosen.length / per));
  const btn = $('#printBtn');
  btn.querySelector('span').textContent = chosen.length ? tp('print_n', chosen.length) : t('labels_none_selected');
  btn.disabled = !chosen.length;
  const frame = $('#previewFrame');
  $('#previewSection').hidden = !chosen.length;
  if (!chosen.length) return;
  frame.innerHTML = labelPages(chosen.slice(0, per), S.labelSize);
  $('#previewNote').textContent = t('page_of', { n: pages });
  const page = frame.firstElementChild;
  const fit = () => {
    const pw = page.offsetWidth, ph = page.offsetHeight;
    const s = frame.clientWidth / pw;
    page.style.transform = `scale(${s})`;
    frame.style.height = Math.ceil(ph * s) + 'px';
  };
  fit();
  requestAnimationFrame(fit);
}
window.addEventListener('resize', debounce(() => { if (document.body.dataset.page === 'labels' && $('#previewFrame')) updateLabelPreview(); }, 150));
async function printLabels() {
  const chosen = labelBoxes().filter((b) => S.labelSel.has(b.id));
  if (!chosen.length) { toast(t('labels_none_selected')); return; }
  $('#printArea').innerHTML = labelPages(chosen, S.labelSize);
  if (document.fonts && document.fonts.status !== 'loaded') { try { await document.fonts.ready; } catch (e) {} }
  window.print();
  const now = new Date().toISOString();
  try {
    must(await sb.from('boxes').update({ label_printed_at: now }).in('id', chosen.map((b) => b.id)));
    chosen.forEach((b) => { const real = S.boxes.find((x) => x.id === b.id); if (real) real.label_printed_at = now; });
    S.labelSel = new Set();
    toast(tp('marked_printed', chosen.length));
    if (document.body.dataset.page === 'labels') renderLabels();
  } catch (e) { /* printing worked; the mark is only a convenience */ }
}
window.addEventListener('afterprint', () => { $('#printArea').innerHTML = ''; });

/* =====================================================================
   Me
   ===================================================================== */
function renderMe() {
  const theme = getThemePref();
  const isIos = /iphone|ipad|ipod/i.test(navigator.userAgent) && !window.MSStream;
  const standalone = window.matchMedia('(display-mode: standalone)').matches || navigator.standalone;
  const install = standalone ? '' : (S.installEvt
    ? `<section><button type="button" class="btn block" data-act="install">${icon('download')}${t('install_app')}</button></section>`
    : (isIos ? `<section><h2 class="setting-title">${t('install_app')}</h2><p class="muted" style="margin:0">${t('install_ios')}</p></section>` : ''));
  $('#view').innerHTML = `
    <header class="page-head"><h1 class="page-title">${t('me_title')}</h1></header>
    <div class="stack">
      <section><label class="field" style="margin:0"><span>${t('your_name')}</span><input class="input" id="meName" maxlength="60" placeholder="${t('name_ph')}" value="${esc(S.profile.display_name || '')}"></label></section>
      <section>
        <h2 class="setting-title">${t('language')}</h2>
        <div class="seg" role="group" aria-label="${t('language')}">
          <button type="button" data-act="set-lang" data-lang="en" aria-pressed="${S.lang === 'en'}">English</button>
          <button type="button" data-act="set-lang" data-lang="tr" aria-pressed="${S.lang === 'tr'}">Türkçe</button>
        </div>
      </section>
      <section>
        <h2 class="setting-title">${t('appearance')}</h2>
        <div class="seg" role="group" aria-label="${t('appearance')}">
          ${['light', 'dark', 'system'].map((m) => `<button type="button" data-act="set-theme" data-theme="${m}" aria-pressed="${theme === m}">${t('theme_' + m)}</button>`).join('')}
        </div>
      </section>
      <section>
        <h2 class="setting-title">${t('ai_scans')}</h2>
        <p style="margin:0" id="meUsage">${esc(S.aiLimit != null ? t('ai_scans_left', { n: S.aiRemaining, limit: S.aiLimit }) : t('ai_scans_unknown'))}</p>
      </section>
      ${install}
      <section>
        <p class="muted" style="margin:0 0 10px">${esc(t('signed_in_as', { email: S.user.email || '' }))}</p>
        <button type="button" class="btn block" data-act="sign-out">${t('sign_out')}</button>
        <button type="button" class="danger-link" data-act="delete-account">${t('delete_account')}</button>
      </section>
    </div>`;
  $('#meName').onchange = async (e) => {
    const v = e.target.value.trim() || null;
    try {
      must(await sb.from('profiles').update({ display_name: v }).eq('user_id', S.user.id));
      S.profile.display_name = v;
      toast(t('saved'));
    } catch (ex) { toast(friendlyError(ex)); }
  };
  refreshUsage().then(() => {
    const el = $('#meUsage');
    if (el && S.aiLimit != null) el.textContent = t('ai_scans_left', { n: S.aiRemaining, limit: S.aiLimit });
  });
}
async function deleteAccount() {
  const ok = await confirmSheet({ title: t('delete_account_q'), body: t('delete_account_body'), confirm: t('delete_account'), danger: true });
  if (!ok) return;
  showBlocker(t('deleting'));
  try {
    const spaces = must(await sb.from('spaces').select('id').eq('owner_id', S.user.id)) || [];
    for (const sp of spaces) {
      for (let from = 0; ; from += 1000) {
        const rows = must(await sb.from('box_photos').select('path').eq('space_id', sp.id).range(from, from + 999)) || [];
        await removeFiles(rows.map((r) => r.path));
        if (rows.length < 1000) break;
      }
    }
    must(await sb.rpc('delete_my_account'));
    S.pendingAuthMessage = t('account_deleted');
    await sb.auth.signOut({ scope: 'local' }).catch(() => {});
    hideBlocker();
    resetSignedOut();
    history.replaceState(null, '', location.pathname);
    renderAuth('in', t('account_deleted'));
  } catch (e) {
    hideBlocker();
    toast(friendlyError(e));
  }
}

/* =====================================================================
   QR scanner
   ===================================================================== */
const scanner = { stream: null, raf: 0, detector: null, busy: false, canvas: null, lastError: 0 };
function loadScript(src) {
  return new Promise((resolve, reject) => {
    if (document.querySelector(`script[src="${src}"]`)) { resolve(); return; }
    const s = document.createElement('script');
    s.src = src; s.onload = resolve; s.onerror = reject;
    document.head.appendChild(s);
  });
}
function showScanError(msg) {
  const el = $('#scannerError');
  el.textContent = msg;
  el.hidden = false;
  scanner.lastError = Date.now();
}
async function openScanner() {
  closeSheet();
  $('#scannerTitle').textContent = t('scanner_title');
  $('#scannerHint').textContent = t('scanner_hint');
  $('#scanCodeInput').placeholder = t('scanner_code_ph');
  $('#scanCodeInput').value = '';
  $('#scanCodeBtn').textContent = t('open');
  $('#scannerClose').setAttribute('aria-label', t('close'));
  $('#scannerError').hidden = true;
  $('#scanner').classList.add('open');
  document.body.classList.add('sheet-open');
  try {
    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) throw new Error('no camera');
    scanner.stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: { ideal: 'environment' } }, audio: false });
    if (!$('#scanner').classList.contains('open')) { stopStream(); return; }
    const video = $('#scanVideo');
    video.srcObject = scanner.stream;
    await video.play().catch(() => {});
    scanner.detector = null;
    if ('BarcodeDetector' in window) {
      try {
        const formats = await window.BarcodeDetector.getSupportedFormats();
        if (formats.includes('qr_code')) scanner.detector = new window.BarcodeDetector({ formats: ['qr_code'] });
      } catch (e) { /* use jsQR */ }
    }
    if (!scanner.detector) await loadScript('/vendor/jsQR.js');
    scanLoop();
  } catch (e) {
    showScanError(t('camera_denied'));
  }
}
function stopStream() {
  cancelAnimationFrame(scanner.raf);
  if (scanner.stream) scanner.stream.getTracks().forEach((tr) => tr.stop());
  scanner.stream = null;
  const v = $('#scanVideo');
  if (v) v.srcObject = null;
}
function closeScanner() {
  stopStream();
  const el = $('#scanner');
  if (el && el.classList.contains('open')) {
    el.classList.remove('open');
    document.body.classList.remove('sheet-open');
  }
}
function scanLoop() {
  let last = 0;
  const tick = async (ts) => {
    if (!scanner.stream) return;
    scanner.raf = requestAnimationFrame(tick);
    if (ts - last < 180 || scanner.busy) return;
    last = ts;
    scanner.busy = true;
    try {
      const text = await detectOnce();
      if (text) handleScanText(text);
    } catch (e) { /* keep scanning */ } finally { scanner.busy = false; }
  };
  scanner.raf = requestAnimationFrame(tick);
}
async function detectOnce() {
  const video = $('#scanVideo');
  if (video.readyState < 2 || !video.videoWidth) return null;
  if (scanner.detector) {
    const codes = await scanner.detector.detect(video);
    return codes && codes[0] ? codes[0].rawValue : null;
  }
  if (!window.jsQR) return null;
  const w = 640, h = Math.round(video.videoHeight / video.videoWidth * 640);
  const c = scanner.canvas || (scanner.canvas = document.createElement('canvas'));
  c.width = w; c.height = h;
  const ctx = c.getContext('2d', { willReadFrequently: true });
  ctx.drawImage(video, 0, 0, w, h);
  const img = ctx.getImageData(0, 0, w, h);
  const r = window.jsQR(img.data, w, h, { inversionAttempts: 'dontInvert' });
  return r ? r.data : null;
}
function handleScanText(text) {
  let id = null;
  try { id = new URL(text).searchParams.get('box'); } catch (e) { /* not a URL */ }
  if (id) { closeScanner(); location.hash = '#/box/' + encodeURIComponent(id); return; }
  if (/^\s*B?-?\s*\d{1,6}\s*$/i.test(text)) { openByCode(text); return; }
  if (Date.now() - scanner.lastError > 2500) showScanError(t('not_a_label'));
}
function openByCode(raw) {
  const digits = String(raw).replace(/\D/g, '');
  if (!digits) return;
  const n = parseInt(digits, 10);
  const code = 'B-' + (n < 10000 ? String(n).padStart(4, '0') : String(n));
  const b = S.boxes.find((x) => x.code.toUpperCase() === code);
  if (b) { closeScanner(); location.hash = '#/box/' + encodeURIComponent(b.id); return; }
  showScanError(t('code_not_found', { code }));
}
$('#scanCodeForm').addEventListener('submit', (e) => { e.preventDefault(); openByCode($('#scanCodeInput').value); });

/* =====================================================================
   Global actions (data-act buttons)
   ===================================================================== */
const ACTIONS = {
  'sheet-close': () => closeSheet(),
  'clear-search': () => { S.query = ''; const q = $('#q'); if (q) { q.value = ''; q.focus(); } renderHomeBody(); },
  'filter': (el) => { S.filter = el.dataset.id; renderHomeBody(); },
  'new-box': () => openBoxForm(null),
  'box-menu': () => openBoxMenu(),
  'edit-box': () => openBoxForm(S.current.box),
  'delete-box': () => deleteBox(),
  'print-box-label': () => { S.labelSel = new Set([S.current.box.id]); closeSheet(); location.hash = '#/labels'; },
  'scan-contents': () => openScanSheet(),
  'add-photo': () => $('#photoOnlyInput').click(),
  'view-photo': (el) => openPhotoViewer(el.dataset.id),
  'edit-item': (el) => openItemEditor(el.dataset.id),
  'new-place': () => openPlaceSheet(null),
  'open-place': (el) => openPlaceSheet(S.locations.find((l) => l.id === el.dataset.id)),
  'show-place': (el) => {
    S.filter = el.dataset.id;
    S.query = '';
    closeSheet();
    if (currentRoute().name === '') renderBoxes(); else location.hash = '#/';
  },
  'open-scanner': () => openScanner(),
  'close-scanner': () => closeScanner(),
  'set-lang': (el) => { setLang(el.dataset.lang, true); renderMe(); },
  'set-theme': (el) => { setTheme(el.dataset.theme); renderMe(); },
  'sign-out': async () => { await sb.auth.signOut().catch(() => {}); },
  'delete-account': () => deleteAccount(),
  'install': async () => { if (!S.installEvt) return; S.installEvt.prompt(); try { await S.installEvt.userChoice; } catch (e) {} S.installEvt = null; renderMe(); },
  'label-size': (el) => { S.labelSize = el.dataset.size; try { localStorage.setItem('bf_label_size', S.labelSize); } catch (e) {} renderLabels(); },
  'label-sel': (el) => {
    const boxes = labelBoxes();
    const mode = el.dataset.mode;
    S.labelSel = new Set(mode === 'all' ? boxes.map((b) => b.id) : mode === 'unprinted' ? boxes.filter((b) => !b.label_printed_at).map((b) => b.id) : []);
    renderLabels();
  },
  'print-labels': () => printLabels()
};
document.addEventListener('click', (e) => {
  const el = e.target.closest('[data-act]');
  if (!el) return;
  const fn = ACTIONS[el.dataset.act];
  if (!fn) return;
  e.preventDefault();
  fn(el, e);
});
document.addEventListener('keydown', (e) => {
  if (e.key !== 'Escape') return;
  if ($('#scanner').classList.contains('open')) closeScanner();
  else closeSheet();
});
window.addEventListener('beforeinstallprompt', (e) => { e.preventDefault(); S.installEvt = e; });

if ('serviceWorker' in navigator && location.protocol === 'https:' && !window.__TEST_SUPABASE__) {
  window.addEventListener('load', () => navigator.serviceWorker.register('/sw.js').catch(() => {}));
}

start();
</script>
